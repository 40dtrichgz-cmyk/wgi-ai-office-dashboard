<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGI AI Office — Master Agent Dashboard</title>
<style>
  :root {
    --bg: #0b0d14;
    --panel: #121624;
    --accent: #22d3ee;
    --accent-glow: rgba(34, 211, 238, 0.35);
    --text: #e5e7eb;
    --muted: #94a3b8;
    --border: #1e293b;
    --ceo: #fbbf24;
    --op: #34d399;
    --warn: #f87171;
    --info: #60a5fa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: linear-gradient(180deg, #0f1420 0%, #0b0d14 100%);
    border-bottom: 1px solid var(--border);
    padding: 1.25rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: 0 4px 20px -10px var(--accent-glow);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .logo {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), #0891b2);
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 1.1rem; color: #022c35;
  }
  .brand-text h1 {
    font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px;
    color: #fff;
  }
  .brand-text p {
    font-size: 0.85rem; color: var(--muted);
  }
  .status-bar {
    display: flex; align-items: center; gap: 1rem;
  }
  .chip {
    display: flex; align-items: center; gap: 0.5rem;
    padding: 0.4rem 0.85rem; border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel); font-size: 0.85rem;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--op);
    box-shadow: 0 0 10px var(--op);
    animation: pulse 2s infinite;
  }
  .dot.warn { background: var(--warn); box-shadow: 0 0 10px var(--warn); }
  .chip-text { font-weight: 600; }
  .controls {
    display: flex; align-items: center; gap: 0.5rem;
    margin-left: 1rem;
  }
  input[type="search"] {
    padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 0.9rem;
    width: 220px;
  }
  input[type="search"]::placeholder { color: var(--muted); }
  .btn {
    padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid var(--accent);
    background: transparent; color: var(--accent); font-weight: 600; font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s;
  }
  .btn:hover { background: var(--accent-glow); }
  .btn svg { width: 14px; height: 14px; fill: currentColor; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 1.25rem;
    padding: 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.25rem;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s;
  }
  .card:hover { transform: translateY(-3px); border-color: var(--accent-glow); }
  .card::before {
    content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
    background: var(--accent);
  }
  .card.ceo::before { background: var(--ceo); }
  .card.op::before { background: var(--op); }

  .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem; }
  .dept-number {
    font-size: 0.75rem; font-weight: 800; color: var(--muted); text-transform: uppercase;
    letter-spacing: 1px;
  }
  .dept-name { font-size: 1.1rem; font-weight: 700; }
  .dept-name th { color: var(--accent); }
  .agent-tag {
    font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    padding: 0.2rem 0.55rem; border-radius: 6px; border: 1px solid var(--border);
    background: #0f172a; color: var(--muted);
  }
  .status-row { display: flex; justify-content: space-between; align-items: center; margin-top: 0.6rem; font-size: 0.8rem; color: var(--muted); }
  .status-value { color: var(--text); font-weight: 600; }

  .desc {
    font-size: 0.85rem; color: var(--muted); line-height: 1.5; margin-top: 0.75rem;
  }
  .duties {
    margin-top: 0.75rem;
  }
  .duty-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; letter-spacing: 0.5px; }
  .duty-list { list-style: none; font-size: 0.8rem; color: var(--muted); line-height: 1.45; }
  .duty-list li { margin-bottom: 0.3rem; padding-left: 1rem; position: relative; }
  .duty-list li::before { content: '▹'; position: absolute; left: 0; color: var(--accent); font-size: 0.6rem; }

  .metrics {
    margin-top: 0.9rem; padding-top: 0.7rem; border-top: 1px solid #1f2937;
    display: flex; gap: 0.9rem; font-size: 0.75rem;
  }
  .metric { color: var(--muted); }
  .metric .val { color: var(--text); font-weight: 700; display: block; font-size: 0.85rem; }

  .empty {
    grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--muted);
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  footer {
    padding: 1.5rem 2rem; border-top: 1px solid var(--border);
    color: var(--muted); font-size: 0.8rem; text-align: center;
  }
  @media (max-width: 640px) {
    .header { padding: 1rem; flex-direction: column; gap: 1rem; align-items: stretch; }
    .status-bar { justify-content: space-between; }
    .controls { margin-left: 0; width: 100%; }
    input[type="search"] { width: 100%; }
    .grid { padding: 1rem; }
  }
</style>
</head>

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  list.forEach(d => {
    const card = document.createElement('article');
    card.className = 'card ' + (d.agent === 'ai-ceo' ? 'ceo' : d.agent === 'ai-operations' ? 'op' : '');
    card.innerHTML = `
      <div class="card-header">
        <div class="dept-number">${d.num}</div>
        <div class="agent-tag">${d.agent}</div>
      </div>
      <div class="dept-name">${d.name} <span style="font-weight:400;font-size:0.9rem;color:var(--muted);">— ${d.nameTH}</span></div>
      <div class="status-row">
        <span style="color:var(--muted)">สถานะ</span>
        <span class="status-value" style="color:var(--op)">${d.status}</span>
        <span style="color:var(--muted)">โมเดล</span>
        <span class="status-value">${d.model}</span>
      </div>
      <div class="desc">${d.desc}</div>
      <div class="duties">
        <div class="duty-title">หน้าที่หลัก</div>
        <ul class="duty-list">
          ${d.duties.map(t => `<li>${t}</li>`).join('')}
        </ul>
      </div>
      <div class="metrics">
        <div class="metric"><span class="val">${d.metric}</span>${d.metricLabel}</div>
        <div class="metric"><span class="val">✓</span>ออนไลน์</div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function filter() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = departments.filter(d =>
    d.name.toLowerCase().includes(q) ||
    d.nameTH.toLowerCase().includes(q) ||
    d.agent.includes(q) ||
    d.desc.toLowerCase().includes(q)
  );
  render(filtered);
  if (filtered.length === 0) {
    document.getElementById('grid').innerHTML = '<div class="empty">ไม่พบแผนกที่ค้นหา</div>';
  }
}

document.getElementById('search').addEventListener('input', filter);
document.getElementById('refresh').addEventListener('click', () => {
  const btn = document.getElementById('refresh');
  btn.textContent = '↻';
  setTimeout(() => { btn.textContent = '↻'; filter(); }, 400);
});

render(departments);
</script>

</body>
</html>
