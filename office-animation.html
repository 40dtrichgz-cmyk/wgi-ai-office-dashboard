<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGI AI Office — Spooky Cafe Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ground: #16121a;
    --surface: #221c27;
    --raised: #2f2738;
    --border: #3d344d;
    --rule: #2a2236;
    --text: #f4f2f7;
    --muted: #a39cb3;
    --faint: #756c85;
    --accent: #b47aea;
    --positive: #5bc8af;
    --negative: #e06d6d;
    --warning: #e0b06d;
    --font: "Inter", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--text);
    font-family: var(--font);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    font-size: 14px;
  }

  /* Header */
  .header {
    position: absolute;
    top: 0; left: 0; right: 0;
    padding: 1rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    background: var(--surface);
    border-bottom: 1px solid var(--rule);
  }
  .brand h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.3px; }
  .brand p { font-size: 0.75rem; color: var(--muted); }
  .nav-group { display: flex; gap: 0.75rem; }
  .nav-btn {
    padding: 0.4rem 0.9rem;
    background: var(--raised);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
  }
  .nav-btn:hover { background: var(--border); }

  /* Scene Container */
  .scene-container {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 60px;
  }

  /* Spooky Cafe Floor & Layout */
  .cafe-floor {
    position: relative;
    width: 960px;
    height: 540px;
    background: var(--ground);
    border: 2px solid var(--border);
    border-radius: 12px;
  }

  /* Background ambiance (pure CSS, no gradients/glows/shadows) */
  .cafe-wall {
    position: absolute;
    top: 0; left: 0; right: 0; height: 160px;
    background: var(--surface);
    border-bottom: 2px solid var(--border);
  }
  .window-grid {
    position: absolute;
    top: 20px; left: 60px; width: 120px; height: 100px;
    border: 2px solid var(--border);
    background: #110e14;
  }
  .window-grid::after {
    content: ''; position: absolute; top: 50%; left: 0; right: 0; height: 2px; background: var(--border);
  }

  /* Center Cashier Counter (CEO / WGI Hub) */
  .center-counter {
    position: absolute;
    top: 180px; left: 400px; width: 160px; height: 80px;
    background: var(--raised);
    border: 2px solid var(--border);
    border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10;
  }
  .counter-top {
    font-weight: 700; font-size: 0.9rem; color: var(--accent);
    margin-bottom: 2px;
  }
  .counter-sub { font-size: 0.7rem; color: var(--muted); }

  /* Workstations */
  .station {
    position: absolute;
    width: 140px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px;
    cursor: pointer;
    z-index: 5;
  }
  .station:hover { border-color: var(--accent); }
  .station-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 4px;
  }
  .station-name { font-weight: 600; font-size: 0.8rem; }
  .station-status {
    font-size: 0.65krem; font-weight: 600; padding: 1px 5px; border-radius: 4px;
    background: var(--rule); color: var(--positive);
  }
  .station-duty {
    font-size: 0.7rem; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Avatar Box (CSS Art for Ghost & Vampire) */
  .avatar-box {
    display: flex; align-items: center; gap: 8px;
    margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--rule);
  }
  .avatar {
    width: 24px; height: 28px; position: relative; flex-shrink: 0;
  }

  /* Ghost CSS Art (Employees) */
  .ghost-body {
    position: absolute; bottom: 0; left: 2px; width: 20px; height: 22px;
    background: #e2def0; border-radius: 10px 10px 4px 4px;
  }
  .ghost-body::after {
    content: ''; position: absolute; bottom: -2px; left: 0; right: 0; height: 4px;
    background: radial-gradient(circle, #16121a 40%, transparent 41%);
    background-size: 6px 6px;
  }
  .ghost-eyes {
    position: absolute; top: 6px; left: 4px; display: flex; gap: 4px;
  }
  .ghost-eyes span { width: 3px; height: 3px; background: #16121a; border-radius: 50%; }

  /* Vampire CSS Art (CEO) */
  .vamp-head {
    position: absolute; top: 2px; left: 4px; width: 16px; height: 16px;
    background: #f4d0c1; border-radius: 50%;
  }
  .vamp-cape {
    position: absolute; bottom: 0; left: 1px; width: 22px; height: 16px;
    background: #3d1c24; border-radius: 4px 4px 10px 10px;
  }
  .vamp-collar {
    position: absolute; top: 12px; left: 2px; width: 20px; height: 6px;
    background: #e06d6d;
  }

  /* Details Panel */
  .details-panel {
    position: absolute;
    bottom: 20px; right: 20px; width: 300px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    z-index: 200;
    display: none;
  }
  .details-panel.visible { display: block; }
  .details-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 4px; color: var(--accent); }
  .details-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 8px; }
  .details-desc { font-size: 0.8rem; line-height: 1.4; color: var(--text); }

  /* Bottom Roster Bar */
  .roster-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 48px; background: var(--surface); border-top: 1px solid var(--rule);
    display: flex; align-items: center; justify-content: center; gap: 1.5rem;
    padding: 0 1rem; z-index: 100;
  }
  .roster-item { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); }
  .roster-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--positive); }
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <h1>WGI AI OFFICE — SPOOKY CAFE</h1>
    <p>Custom CSS Art & Flat Design Standards</p>
  </div>
  <div class="nav-group">
    <a href="./department-dashboard.html" class="nav-btn">Dashboard</a>
  </div>
</header>

<div class="scene-container">
  <div class="cafe-floor">
    <div class="cafe-wall">
      <div class="window-grid"></div>
    </div>

    <!-- Center Cashier Counter (CEO) -->
    <div class="center-counter" style="top: 100px; left: 380px; width: 200px;">
      <div class="counter-top">CEO ROOM / MAIN COUNTER</div>
      <div class="counter-sub">AI CEO (Dracula)</div>
    </div>

    <!-- Workstations for 12 Departments -->
    <div id="stations-container"></div>
  </div>
</div>

<div class="details-panel" id="details-panel">
  <div class="details-title" id="d-title">—</div>
  <div class="details-sub" id="d-sub">—</div>
  <div class="details-desc" id="d-desc">—</div>
</div>

<div class="roster-bar" id="roster-bar"></div>

<script>
  async function init() {
    const res = await fetch('./data/departments.json');
    const data = await res.json();
    renderOffice(data.departments);
  }

  // Fixed positions across the cafe floor
  const coords = [
    { top: 100, left: 160 }, // CEO
    { top: 220, left: 60 },  // Strategy
    { top: 340, left: 60 },  // Sales
    { top: 430, left: 160 }, // Finance
    { top: 430, left: 320 }, // HR
    { top: 430, left: 480 }, // Operations
    { top: 430, left: 640 }, // Marketing
    { top: 340, left: 760 }, // IT & Data
    { top: 220, left: 760 }, // Legal
    { top: 100, left: 640 }, // Research
    { top: 100, left: 480 }, // Support
    { top: 100, left: 320 }  // Admin
  ];

  function renderOffice(depts) {
    const container = document.getElementById('stations-container');
    const roster = document.getElementById('roster-bar');
    container.innerHTML = '';
    roster.innerHTML = '';

    depts.forEach((d, i) => {
      const pos = coords[i] || { top: 200, left: 200 };
      const isCEO = d.agent === 'ai-ceo';

      // Station DOM
      const st = document.createElement('div');
      st.className = 'station';
      st.style.top = pos.top + 'px';
      st.style.left = pos.left + 'px';

      const avatarHTML = isCEO ? `
        <div class="avatar">
          <div class="vamp-cape"></div>
          <div class="vamp-collar"></div>
          <div class="vamp-head"></div>
        </div>
      ` : `
        <div class="avatar">
          <div class="ghost-body"></div>
          <div class="ghost-eyes"><span></span><span></span></div>
        </div>
      `;

      st.innerHTML = `
        <div class="station-header">
          <span class="station-name">${d.name}</span>
          <span class="station-status" style="color: ${d.status === 'Active' ? 'var(--positive)' : 'var(--warning)'}">${d.status}</span>
        </div>
        <div class="station-duty">${d.metric}</div>
        <div class="avatar-box">
          ${avatarHTML}
          <div style="font-size: 0.7rem; color: var(--muted);">${d.nameTH}</div>
        </div>
      `;

      st.addEventListener('click', () => {
        showDetails(d);
      });

      container.appendChild(st);

      // Roster item
      const rItem = document.createElement('div');
      rItem.className = 'roster-item';
      rItem.innerHTML = `<div class="roster-dot" style="background: ${d.status === 'Active' ? 'var(--positive)' : 'var(--warning)'}"></div><span>${d.name}</span>`;
      roster.appendChild(rItem);
    });
  }

  function showDetails(d) {
    const panel = document.getElementById('details-panel');
    document.getElementById('d-title').textContent = d.name + ' — ' + d.nameTH;
    document.getElementById('d-sub').textContent = 'Role: ' + d.agent + ' | Model: ' + d.model + ' | Status: ' + d.status;
    document.getElementById('d-desc').textContent = d.desc;
    panel.classList.add('visible');
  }

  document.addEventListener('click', (e) => {
    if (e.target.closest('.station') || e.target.closest('.details-panel')) return;
    document.getElementById('details-panel').classList.remove('visible');
  });

  init();
</script>

</body>
</html>
