<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGI AI Agency — 3D Liquid Glass Headquarters</title>
<style>
  body { margin: 0; overflow: hidden; background: #0b0d14; font-family: 'Inter', sans-serif; }
  #canvas { position: absolute; top: 0; left: 0; }
  .details-panel {
    position: absolute; top: 20px; right: 20px; width: 300px;
    background: rgba(11, 13, 20, 0.8); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
    padding: 1.5rem; color: #fff; display: none; z-index: 10;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="details-panel" class="details-panel">
  <h2 id="d-title" style="color: #22d3ee; margin-bottom: 0.5rem;"></h2>
  <p id="d-sub" style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 1rem;"></p>
  <p id="d-desc" style="font-size: 0.9rem; line-height: 1.5;"></p>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  let scene, camera, renderer, controls;
  const stations = [];
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();

  window.stations = stations;

  async function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d14);

    camera = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 1000);
    camera.position.set(20, 20, 20);
    camera.zoom = 0.5;
    camera.updateProjectionMatrix();

    renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1);
    dirLight.position.set(10, 20, 10);
    scene.add(dirLight);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(30, 30),
      new THREE.MeshPhysicalMaterial({ color: 0x141620, roughness: 0.1, metalness: 0.1 })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const res = await fetch('./data/departments.json');
    const data = await res.json();
    createOffice(data.departments);

    animate();
  }

  function createOffice(depts) {
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.1, metalness: 0,
      transmission: 0.9, thickness: 1.5, transparent: true, side: THREE.DoubleSide
    });

    depts.forEach((d, i) => {
      const angle = (i / depts.length) * Math.PI * 2;
      const x = Math.cos(angle) * 7;
      const z = Math.sin(angle) * 7;

      const group = new THREE.Group();
      group.position.set(x, 0, z);

      const desk = new THREE.Mesh(new THREE.BoxGeometry(2, 0.5, 1), glassMat);
      group.add(desk);

      const agent = new THREE.Mesh(new THREE.CapsuleGeometry(0.3, 0.6), new THREE.MeshStandardMaterial({ color: d.status === 'Active' ? 0x22d3ee : 0xe5a93b }));
      agent.position.y = 0.8;
      group.add(agent);

      group.userData = d;
      scene.add(group);
      stations.push(group);
    });
  }

  function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.updateProjectionMatrix();
  });

  window.addEventListener('click', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(stations, true);
    if (intersects.length > 0) {
      const d = intersects[0].object.parent.userData;
      document.getElementById('d-title').textContent = d.name;
      document.getElementById('d-sub').textContent = d.status + ' | ' + d.model;
      document.getElementById('d-desc').textContent = d.desc;
      document.getElementById('details-panel').style.display = 'block';
    } else {
      document.getElementById('details-panel').style.display = 'none';
    }
  });

  init();
</script>
</body>
</html>
