<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WGI AI Agency — Halloween Glass Headquarters</title>
<style>
  body { margin: 0; overflow: hidden; background: #0b0d14; font-family: 'Inter', sans-serif; }
  #canvas { position: absolute; top: 0; left: 0; }
  .details-panel {
    position: absolute; top: 20px; right: 20px; width: 320px;
    background: rgba(11, 13, 20, 0.85); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 12px;
    padding: 1.5rem; color: #fff; display: none; z-index: 10;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .hud-title {
    position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10;
    pointer-events: none;
  }
  .hud-title h1 { font-size: 1.2rem; font-weight: 700; letter-spacing: -0.3px; margin: 0; color: #22d3ee; }
  .hud-title p { font-size: 0.75rem; color: #94a3b8; margin: 2px 0 0 0; }
</style>
</head>
<body>
<div class="hud-title">
  <h1>WGI AI HEADQUARTERS</h1>
  <p>Halloween Liquid Glass Edition · Click workstation to inspect</p>
</div>

<canvas id="canvas"></canvas>

<div id="details-panel" class="details-panel">
  <h2 id="d-title" style="color: #22d3ee; margin-bottom: 0.2rem; font-size: 1.1rem;"></h2>
  <p id="d-th" style="font-size: 0.8rem; color: #cbd5e1; margin-bottom: 0.8rem;"></p>
  <p id="d-sub" style="font-size: 0.75rem; color: #94a3b8; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;"></p>
  <p id="d-desc" style="font-size: 0.85rem; line-height: 1.5; color: #e2e8f0;"></p>
</div>

<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  let scene, camera, renderer, controls;
  const stations = [];
  window.stations = stations;
  let logoRing = null;
  let hologramPanels = [];
  const raycaster = new THREE.Raycaster();
  const mouse = new THREE.Vector2();
  let reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  async function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0b0d14);
    scene.fog = new THREE.FogExp2(0x0b0d14, 0.015);

    camera = new THREE.OrthographicCamera(-12, 12, 12, -12, 0.1, 1000);
    camera.position.set(22, 22, 22);
    camera.zoom = 0.55;
    camera.updateProjectionMatrix();

    renderer = new THREE.WebGLRenderer({ canvas: document.querySelector('#canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.05; // Don't go below floor

    // Lights
    const ambient = new THREE.AmbientLight(0xdbeafe, 0.6);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(15, 25, 15);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0x22d3ee, 2, 20);
    pointLight.position.set(0, 5, 0);
    scene.add(pointLight);

    // Floor
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshPhysicalMaterial({ color: 0x0f172a, roughness: 0.15, metalness: 0.1 })
    );
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Central Glass CEO Hub / WGI Pillar
    const coreGeo = new THREE.CylinderGeometry(1.5, 2, 4, 32);
    const coreMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff, roughness: 0.1, metalness: 0.1,
      transmission: 0.85, thickness: 2.0, transparent: true
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    core.position.y = 2;
    core.castShadow = true;
    core.receiveShadow = true;
    scene.add(core);

    // Load Department Data & Build Office
    const res = await fetch('./data/departments.json');
    const data = await res.json();
    createOffice(data.departments);

    // Add Halloween Decor via InstancedMesh
    addDecor();

    animate();
  }

  function createMushroomDesk(colorHex) {
    const group = new THREE.Group();
    const glassMat = new THREE.MeshPhysicalMaterial({
      color: colorHex || 0xffffff, roughness: 0.1, metalness: 0.05,
      transmission: 0.85, thickness: 1.5, transparent: true
    });

    // Stem
    const stemGeo = new THREE.CylinderGeometry(0.3, 0.4, 0.8, 16);
    const stem = new THREE.Mesh(stemGeo, glassMat);
    stem.position.y = 0.4;
    stem.castShadow = true;
    group.add(stem);

    // Cap
    const capGeo = new THREE.CylinderGeometry(1.4, 1.2, 0.3, 32);
    const cap = new THREE.Mesh(capGeo, glassMat);
    cap.position.y = 0.95;
    cap.castShadow = true;
    group.add(cap);

    return group;
  }

  function createGhostAgent(colorHex) {
    const group = new THREE.Group();
    const mat = new THREE.MeshStandardMaterial({ color: colorHex || 0xe2e8f0, roughness: 0.4 });

    // Bell-shaped body
    const bodyGeo = new THREE.SphereGeometry(0.5, 16, 16);
    bodyGeo.scale(1, 1.3, 1);
    const body = new THREE.Mesh(bodyGeo, mat);
    body.position.y = 0.6;
    body.castShadow = true;
    group.add(body);

    // Eyes
    const eyeMat = new THREE.MeshBasicMaterial({ color: 0x0f172a });
    const eyeGeo = new THREE.SphereGeometry(0.08, 8, 8);
    const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
    leftEye.position.set(-0.15, 0.75, 0.4);
    const rightEye = new THREE.Mesh(eyeGeo, eyeMat);
    rightEye.position.set(0.15, 0.75, 0.4);
    group.add(leftEye, rightEye);

    group.userData.isAgent = true;
    return group;
  }

  function createVampireCEO() {
    const group = new THREE.Group();
    const skinMat = new THREE.MeshStandardMaterial({ color: 0xf4d0c1 });
    const suitMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b });
    const capeMat = new THREE.MeshStandardMaterial({ color: 0x7f1d1d });

    // Head
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), skinMat);
    head.position.y = 1.2;
    head.castShadow = true;
    group.add(head);

    // Body / Suit
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 0.9, 16), suitMat);
    body.position.y = 0.55;
    body.castShadow = true;
    group.add(body);

    // Cape
    const cape = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.1, 16), capeMat);
    cape.position.y = 0.6;
    cape.rotation.x = Math.PI;
    group.add(cape);

    group.userData.isAgent = true;
    return group;
  }

  function createOffice(depts) {
    depts.forEach((d, i) => {
      const angle = (i / depts.length) * Math.PI * 2;
      const radius = 8.5;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      const group = new THREE.Group();
      group.position.set(x, 0, z);
      // Rotate to face center
      group.rotation.y = -angle + Math.PI / 2;

      const colorHex = d.color || 0x22d3ee;

      // Mushroom Desk
      const desk = createMushroomDesk(colorHex);
      group.add(desk);

      // Agent (CEO gets Vampire, others get Ghosts)
      let agent;
      if (d.agent === 'ai-ceo') {
        agent = createVampireCEO();
        agent.position.set(0, 0, -0.6);
      } else {
        agent = createGhostAgent(colorHex);
        agent.position.set(0, 0, -0.6);
      }
      group.add(agent);

      group.userData = d;
      scene.add(group);
      stations.push(group);
    });
  }

  function addDecor() {
    const dummy = new THREE.Object3D();

    // --- Floating Jack-o'-lanterns (InstancedMesh) ---
    const pumpkinGeo = new THREE.SphereGeometry(0.4, 16, 16);
    pumpkinGeo.scale(1, 0.8, 1);
    const pumpkinMat = new THREE.MeshStandardMaterial({ color: 0xe5a93b, roughness: 0.3 });
    const pumpkinInst = new THREE.InstancedMesh(pumpkinGeo, pumpkinMat, 12);
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2 + 0.2;
      dummy.position.set(Math.cos(angle) * 11, 0.3, Math.sin(angle) * 11);
      dummy.updateMatrix();
      pumpkinInst.setMatrixAt(i, dummy.matrix);
    }
    pumpkinInst.instanceMatrix.needsUpdate = true;
    scene.add(pumpkinInst);

    // --- Hanging Cobweb Strands (InstancedMesh) ---
    const cobGeo = new THREE.CylinderGeometry(0.02, 0.02, 1.5, 4);
    const cobMat = new THREE.MeshStandardMaterial({ color: 0x94a3b8, roughness: 0.8 });
    const cobInst = new THREE.InstancedMesh(cobGeo, cobMat, 8);
    for (let i = 0; i < 8; i++) {
      const angle = (i / 8) * Math.PI * 2;
      dummy.position.set(Math.cos(angle) * 10, 2.5, Math.sin(angle) * 10);
      dummy.updateMatrix();
      cobInst.setMatrixAt(i, dummy.matrix);
    }
    cobInst.instanceMatrix.needsUpdate = true;
    scene.add(cobInst);

    // --- Glowing Cauldrons (InstancedMesh) ---
    const cauldronGeo = new THREE.CylinderGeometry(0.5, 0.4, 0.7, 16);
    const cauldronMat = new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.3, metalness: 0.3 });
    const cauldronInst = new THREE.InstancedMesh(cauldronGeo, cauldronMat, 6);
    for (let i = 0; i < 6; i++) {
      const angle = (i / 6) * Math.PI * 2 + 0.5;
      dummy.position.set(Math.cos(angle) * 9.5, 0.35, Math.sin(angle) * 9.5);
      dummy.updateMatrix();
      cauldronInst.setMatrixAt(i, dummy.matrix);
    }
    cauldronInst.instanceMatrix.needsUpdate = true;
    scene.add(cauldronInst);

    // --- Floating Bats (InstancedMesh) ---
    const batGeo = new THREE.SphereGeometry(0.15, 8, 8);
    batGeo.scale(1, 0.2, 0.6);
    const batMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
    const batInst = new THREE.InstancedMesh(batGeo, batMat, 10);
    for (let i = 0; i < 10; i++) {
      const angle = (i / 10) * Math.PI * 2;
      dummy.position.set(Math.cos(angle) * 13, 3 + Math.sin(i * 2) * 0.5, Math.sin(angle) * 13);
      dummy.updateMatrix();
      batInst.setMatrixAt(i, dummy.matrix);
    }
    batInst.instanceMatrix.needsUpdate = true;
    scene.add(batInst);

    // --- Candle Clusters (InstancedMesh) ---
    const candleGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.4, 8);
    const candleMat = new THREE.MeshStandardMaterial({ color: 0xfde68a, roughness: 0.4 });
    const candleInst = new THREE.InstancedMesh(candleGeo, candleMat, 12);
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      dummy.position.set(Math.cos(angle) * 9, 0.2, Math.sin(angle) * 9);
      dummy.updateMatrix();
      candleInst.setMatrixAt(i, dummy.matrix);
    }
    candleInst.instanceMatrix.needsUpdate = true;
    scene.add(candleInst);

    // --- Central Holographic WGI Logo above CEO hub ---
    const logoRingGeo = new THREE.TorusGeometry(1.8, 0.05, 16, 48);
    const logoMat = new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.7 });
    logoRing = new THREE.Mesh(logoRingGeo, logoMat);
    logoRing.position.y = 5;
    scene.add(logoRing);

    // --- Holographic Data Panels near each workstation ---
    stations.forEach((st, i) => {
      const panelGeo = new THREE.PlaneGeometry(0.8, 0.3);
      const panelMat = new THREE.MeshBasicMaterial({
        color: 0x22d3ee, transparent: true, opacity: 0.6,
        side: THREE.DoubleSide
      });
      const panel = new THREE.Mesh(panelGeo, panelMat);
      panel.position.copy(st.position);
      panel.position.y = 1.8;
      panel.lookAt(camera.position);
      hologramPanels.push(panel);
      scene.add(panel);
    });
  }

  const clock = new THREE.Clock();

  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();

    // Floating bob animation for agents (if reduced motion is off)
    if (!reducedMotion) {
      stations.forEach((st, idx) => {
        const agent = st.children.find(c => c.userData.isAgent);
        if (agent) {
          agent.position.y = (st.userData.agent === 'ai-ceo' ? 0 : 0.8) + Math.sin(elapsedTime * 3 + idx) * 0.08;
        }
      });
    }

    // Decor animations
    if (!reducedMotion) {
      if (logoRing) {
        logoRing.rotation.z = elapsedTime * 0.5;
      }
      // Update holographic panels to face camera
      hologramPanels.forEach((panel, i) => {
        panel.material.opacity = 0.4 + Math.sin(elapsedTime * 2 + i) * 0.2;
        panel.lookAt(camera.position);
      });
    }

    controls.update();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.updateProjectionMatrix();
  });

  function findStationGroup(obj) {
    let cur = obj;
    while (cur && cur !== scene) {
      if (cur.userData && cur.userData.name) return cur;
      cur = cur.parent;
    }
    return null;
  }

  window.addEventListener('click', (e) => {
    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObjects(stations, true);
    if (intersects.length > 0) {
      const group = findStationGroup(intersects[0].object);
      if (group) {
        const d = group.userData;
        document.getElementById('d-title').textContent = d.name + ' (' + d.nameTH + ')';
        document.getElementById('d-th').textContent = 'Role: ' + d.agent;
        document.getElementById('d-sub').textContent = 'Status: ' + d.status + ' | Model: ' + d.model + ' | Metric: ' + d.metric;
        document.getElementById('d-desc').textContent = d.desc;
        document.getElementById('details-panel').style.display = 'block';
      }
    } else {
      document.getElementById('details-panel').style.display = 'none';
    }
  });

  init();
</script>
</body>
</html>
